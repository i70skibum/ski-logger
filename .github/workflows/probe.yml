name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/probe.py
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe_out
          path: probe_out
