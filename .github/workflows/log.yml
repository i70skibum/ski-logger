name: ski-logger

# The Cloudflare Worker (ski-logger-trigger) starts this every 15 minutes. GitHub's own schedule
# was removed: it fired late and unpredictably and sometimes collided with the Worker's run.
on:
  workflow_dispatch:          # the Cloudflare Worker starts it; you can also run it by hand from the Actions tab
    inputs:
      status:
        description: "Resort lift and trail status from the Cloudflare Worker (JSON)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ski-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CDOT_API_KEY: ${{ secrets.CDOT_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      RESORT_STATUS: ${{ inputs.status }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect data
        run: python3 logger.py

      - name: Save data to the repo
        run: |
          git config user.name "ski-logger"
          git config user.email "ski-logger"
          git add data
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            # Another run saved first and the files clash: start from its data, collect again, retry.
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 logger.py
            git add data
            if git diff --cached --quiet; then echo "no new data"; exit 0; fi
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          exit 1
